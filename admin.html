<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administración | LuStyle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f2;--card:#fff;--ink:#2b1220;--mute:#85666f;--line:#f1d6d6;--rose:#d4607f;--gold:#c9a063;--ok:#3f9b6e;--bad:#c4414f}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:300 1rem/1.6 Jost,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,.logo{font-family:"Cormorant Garamond",Georgia,serif}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 5%;background:#2b1220;color:#fff;position:sticky;top:0;z-index:5}
.logo{font-size:1.6rem;font-weight:700}.logo i{color:var(--gold);font-weight:500}
.tag{background:rgba(255,255,255,.14);padding:6px 14px;border-radius:20px;font-size:.78rem}
.out{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;padding:7px 16px;border-radius:20px;cursor:pointer;font:400 .78rem Jost}
main{max-width:1150px;margin:auto;padding:34px 5% 60px}
.eb{letter-spacing:.3em;font-size:.68rem;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(2.2rem,6vw,3.2rem);line-height:1.1;margin:4px 0}
.sub{color:var(--mute);margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.st{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 18px}.st span{font-size:.8rem;color:var(--mute)}.st b{display:block;font:700 2.2rem/1.1 "Cormorant Garamond",serif;color:var(--rose)}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 18px;border-radius:24px;cursor:pointer;font:400 .85rem Jost}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.clear{border:1px solid var(--bad);color:var(--bad);background:transparent;padding:8px 16px;border-radius:24px;cursor:pointer;font:400 .8rem Jost}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.cita{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.img{height:190px;background:linear-gradient(135deg,#fbe6e4,#f6d3df);display:grid;place-items:center;color:var(--mute);font-size:.85rem;cursor:default;position:relative}
.img img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.img small{position:absolute;left:10px;bottom:8px;background:rgba(43,18,32,.75);color:#fff;padding:2px 10px;border-radius:12px;font-size:.7rem}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h2{font-size:1.5rem;line-height:1.1}
.row{font-size:.9rem;color:var(--mute)}.row b{color:var(--ink);font-weight:500}
.badge{align-self:flex-start;padding:3px 14px;border-radius:16px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.pendiente{background:#fff0d6;color:#9a6a12}.confirmada{background:#dff3e8;color:var(--ok)}.cancelada{background:#fbe0e3;color:var(--bad)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.b{border:0;cursor:pointer;border-radius:22px;padding:9px 16px;font:500 .8rem Jost;color:#fff}.ok{background:var(--ok)}.no{background:var(--bad)}.del{background:transparent;color:var(--mute);border:1px solid var(--line)}
.empty{text-align:center;padding:60px 10px;color:var(--mute)}.empty div{font-size:3rem}
.lb{position:fixed;inset:0;background:rgba(20,8,14,.88);display:none;place-items:center;z-index:20;padding:20px}.lb.on{display:grid}.lb img{max-width:100%;max-height:92vh;border-radius:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:24px;font-size:.88rem;opacity:0;pointer-events:none;transition:.3s;z-index:30;max-width:90%;text-align:center}.toast.on{opacity:1}
.back{display:inline-block;margin-top:26px;color:var(--rose);text-decoration:none}
</style>
</head>
<body>
<header><span class="logo">Lu<i>Style</i></span><div style="display:flex;gap:10px;align-items:center"><span class="tag">👑 Administradora</span><button class="out" id="salir">Cerrar sesión</button></div></header>
<main>
<p class="eb">Panel de administración</p><h1>Mis citas</h1>
<p class="sub">Confirma o cancela y avísale a la clienta por WhatsApp con un toque.</p>
<section class="stats"><div class="st"><span>Total</span><b id="sT">0</b></div><div class="st"><span>Pendientes</span><b id="sP">0</b></div><div class="st"><span>De hoy</span><b id="sH">0</b></div><div class="st"><span>Próximas</span><b id="sF">0</b></div></section>
<div class="bar"><div class="tabs" id="tabs"></div><button class="clear" id="clear">Eliminar todas</button></div>
<div class="grid" id="grid"></div>
<a class="back" href="index.html">← Volver a LuStyle</a>
</main>
<div class="lb" id="lb"><img alt="Diseño"></div>
<div class="toast" id="tst"></div>
<script src="config.js"></script>
<script>
/* LuStyle · capa de datos (citas). La configuración viene de config.js (opcional). */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || null;
const ADMIN_LOCAL = { usuario: "admin", clave: "LuStyle2026" }; // solo para el modo prueba
const LS_KEY = "belleNailsCitas";
const FB_V = "10.12.2";

let _fb;
function _loadFb() {
  return _fb || (_fb = (async () => {
    const b = `https://www.gstatic.com/firebasejs/${FB_V}/`;
    const [A, F, Au] = await Promise.all([import(b + "firebase-app.js"), import(b + "firebase-firestore.js"), import(b + "firebase-auth.js")]);
    const app = A.initializeApp(FIREBASE_CONFIG);
    return { F, Au, db: F.getFirestore(app), auth: Au.getAuth(app) };
  })());
}
const _ls = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; } };
const _save = l => localStorage.setItem(LS_KEY, JSON.stringify(l));

const Datos = {
  nube: !!FIREBASE_CONFIG,

  async crear(c) {
    c.estado = "pendiente"; c.creada = Date.now();
    if (this.nube) { const { F, db } = await _loadFb(); return (await F.addDoc(F.collection(db, "citas"), c)).id; }
    c.id = "c" + c.creada + Math.random().toString(36).slice(2, 6);
    const l = _ls(); l.push(c); _save(l); return c.id;
  },

  async listar() {
    if (this.nube) {
      const { F, db } = await _loadFb();
      const r = await F.getDocs(F.query(F.collection(db, "citas"), F.orderBy("creada", "desc")));
      return r.docs.map(d => ({ ...d.data(), id: d.id }));
    }
    const l = _ls(); let ch = false;
    l.forEach((c, i) => {
      if (!c.id) { c.id = "c" + i + Math.random().toString(36).slice(2, 6); ch = true; }
      if (!c.estado) { c.estado = "pendiente"; ch = true; }
    });
    if (ch) _save(l);
    return l.slice().reverse();
  },

  async actualizar(id, cambios) {
    if (this.nube) { const { F, db } = await _loadFb(); return F.updateDoc(F.doc(db, "citas", id), cambios); }
    const l = _ls(), c = l.find(x => x.id === id); if (c) Object.assign(c, cambios); _save(l);
  },

  async eliminar(id) {
    if (this.nube) { const { F, db } = await _loadFb(); return F.deleteDoc(F.doc(db, "citas", id)); }
    _save(_ls().filter(x => x.id !== id));
  },

  async eliminarTodas() {
    if (this.nube) { for (const c of await this.listar()) await this.eliminar(c.id); return; }
    localStorage.removeItem(LS_KEY);
  },

  async login(usuario, clave) {
    if (this.nube) { const { Au, auth } = await _loadFb(); await Au.signInWithEmailAndPassword(auth, usuario, clave); return true; }
    if (usuario === ADMIN_LOCAL.usuario && clave === ADMIN_LOCAL.clave) { sessionStorage.setItem("belleNailsAdmin", "true"); return true; }
    throw new Error("credenciales");
  },

  async haySesion() {
    if (this.nube) { const { Au, auth } = await _loadFb(); return new Promise(r => { const u = Au.onAuthStateChanged(auth, x => { u(); r(!!x); }); }); }
    return sessionStorage.getItem("belleNailsAdmin") === "true";
  },

  async salir() {
    if (this.nube) { const { Au, auth } = await _loadFb(); await Au.signOut(auth); }
    sessionStorage.removeItem("belleNailsAdmin");
  }
};

/* Convierte el teléfono de la clienta al formato de WhatsApp (Colombia +57) */
function telWhatsApp(t) {
  let d = String(t || "").replace(/\D/g, "");
  if (d.length === 10) d = "57" + d;
  return d;
}

</script>
<script>
const esc=t=>{const d=document.createElement("div");d.textContent=t||"";return d.innerHTML};
const fecha=f=>{if(!f)return"-";const p=f.split("-");return p[2]+"/"+p[1]+"/"+p[0]};
const toast=t=>{const e=document.getElementById("tst");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),4200)};
let CITAS=[],FIL="todas";
const FILTROS=[["todas","Todas"],["pendiente","Pendientes"],["confirmada","Confirmadas"],["cancelada","Canceladas"]];

async function init(){
  if(!await Datos.haySesion()){location.href="login.html";return}
  await cargar();
}
async function cargar(){
  try{CITAS=await Datos.listar()}catch(e){toast("No pude cargar las citas. Revisa tu conexión o la configuración.");console.error(e);CITAS=[]}
  pintar();
}
function pintar(){
  const hoy=new Date().toLocaleDateString("en-CA");
  sT.textContent=CITAS.length;
  sP.textContent=CITAS.filter(c=>c.estado==="pendiente").length;
  sH.textContent=CITAS.filter(c=>c.date===hoy&&c.estado!=="cancelada").length;
  sF.textContent=CITAS.filter(c=>c.date>=hoy&&c.estado!=="cancelada").length;
  tabs.innerHTML=FILTROS.map(f=>`<button class="tab ${FIL===f[0]?"on":""}" data-f="${f[0]}">${f[1]}</button>`).join("");
  const L=CITAS.filter(c=>FIL==="todas"||c.estado===FIL).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(!L.length){grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div>💅</div><h3>No hay citas aquí todavía</h3><p>Cuando una clienta reserve, aparecerá en este panel.</p></div>`;return}
  grid.innerHTML=L.map(c=>`<article class="cita">
  <div class="img">${c.design?`<img src="${c.design}" alt="Diseño de ${esc(c.name)}" data-z="1"><small>Diseño de la clienta</small>`:"Sin imagen de diseño"}</div>
  <div class="body"><span class="badge ${c.estado}">${c.estado}</span>
  <h2>${esc(c.name)}</h2>
  <div class="row">📞 <b>${esc(c.phone)}</b></div>
  <div class="row">💅 <b>${esc(c.service)}</b>${c.price?` · ${esc(c.price)}`:""}</div>
  <div class="row">📅 <b>${fecha(c.date)}</b> · ${esc(c.time)}</div>
  ${c.look?`<div class="row">🎨 Look: <b>${esc(c.look)}</b></div>`:""}
  <div class="act">
   ${c.estado!=="confirmada"?`<button class="b ok" data-a="ok" data-id="${c.id}">Confirmar ✆</button>`:""}
   ${c.estado!=="cancelada"?`<button class="b no" data-a="no" data-id="${c.id}">Cancelar ✆</button>`:""}
   <button class="b del" data-a="del" data-id="${c.id}">Eliminar</button>
  </div></div></article>`).join("");
}
function abrirWA(c,texto){window.open(`https://wa.me/${telWhatsApp(c.phone)}?text=${encodeURIComponent(texto)}`,"_blank")}

document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.dataset.f){FIL=t.dataset.f;pintar();return}
  if(t.dataset.z){lb.querySelector("img").src=t.src;lb.classList.add("on");return}
  if(t===lb||lb.contains(t)){lb.classList.remove("on");return}
  const a=t.dataset.a,id=t.dataset.id;if(!a)return;
  const c=CITAS.find(x=>x.id===id);if(!c)return;
  if(a==="ok"){
    abrirWA(c,`Hola ${c.name} 💖, te escribe LuStyle. Tu cita de ${c.service} quedó *confirmada* para el ${fecha(c.date)} a las ${c.time}. ¡Te esperamos! ✨`);
    await Datos.actualizar(id,{estado:"confirmada"});toast("Cita confirmada. Envía el mensaje en WhatsApp.");
  }
  if(a==="no"){
    const m=prompt("Motivo de la cancelación (opcional):");if(m===null)return;
    abrirWA(c,`Hola ${c.name}, te escribe LuStyle. Lamentablemente tuvimos que *cancelar* tu cita de ${c.service} del ${fecha(c.date)} a las ${c.time}${m.trim()?`. Motivo: ${m.trim()}`:""}. Escríbenos y la reprogramamos con gusto 💅`);
    await Datos.actualizar(id,{estado:"cancelada",motivo:m.trim()});toast("Cita cancelada. Envía el mensaje en WhatsApp.");
  }
  if(a==="del"){if(!confirm("¿Seguro que quieres eliminar esta cita?"))return;await Datos.eliminar(id)}
  await cargar();
});
clear.onclick=async()=>{if(!CITAS.length)return toast("No hay citas para eliminar.");if(!confirm("¿Seguro que quieres eliminar TODAS las citas?"))return;await Datos.eliminarTodas();cargar()};
salir.onclick=async()=>{await Datos.salir();location.href="login.html"};
init();
</script>
</body>
</html>
