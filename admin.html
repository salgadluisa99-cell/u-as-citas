<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración | Belle Nails</title>

    <style>

        :root {
            --cream: #fcf8f5;
            --pink: #c67b96;
            --pink-dark: #b76884;
            --pink-light: #f2dfe5;
            --text: #2f1a1f;
            --muted: #876d76;
            --line: #ead8dd;
            --white: #ffffff;
            --green: #5c9b78;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--cream);
            color: var(--text);
        }

        /* NAVBAR */

        .navbar {
            min-height: 65px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 12px 7%;

            background: white;

            border-bottom: 1px solid var(--line);
        }

        .brand {
            font-family: Georgia, serif;
            font-size: 22px;

            display: flex;
            align-items: center;

            gap: 8px;
        }

        .star {
            color: var(--pink);
            font-size: 24px;
        }

        .admin-label {
            background: var(--pink-light);

            color: var(--pink-dark);

            padding: 8px 15px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }


        /* CONTENIDO */

        .container {
            width: 86%;

            max-width: 1200px;

            margin: 45px auto;
        }

        .page-title {
            margin-bottom: 30px;
        }

        .page-title span {
            color: var(--pink);

            font-size: 11px;

            letter-spacing: 3px;
        }

        .page-title h1 {
            font-family: Georgia, serif;

            font-size: 40px;

            margin-top: 8px;
        }

        .page-title p {
            color: var(--muted);

            font-size: 14px;

            margin-top: 8px;
        }


        /* ESTADÍSTICAS */

        .stats {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 35px;
        }

        .stat-card {
            background: white;

            border: 1px solid var(--line);

            border-radius: 18px;

            padding: 25px;
        }

        .stat-card span {
            color: var(--muted);

            font-size: 12px;
        }

        .stat-card strong {
            display: block;

            font-family: Georgia, serif;

            font-size: 32px;

            margin-top: 8px;

            color: var(--pink-dark);
        }


        /* CITAS */

        .appointments-box {
            background: white;

            border: 1px solid var(--line);

            border-radius: 20px;

            overflow: hidden;
        }

        .appointments-header {
            padding: 22px 25px;

            border-bottom: 1px solid var(--line);

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .appointments-header h2 {
            font-family: Georgia, serif;

            font-size: 24px;
        }

        .clear-button {
            border: 1px solid #d69aaa;

            background: transparent;

            color: var(--pink-dark);

            padding: 9px 15px;

            border-radius: 20px;

            font-size: 11px;

            cursor: pointer;
        }

        .clear-button:hover {
            background: var(--pink-light);
        }


        /* TABLA */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 750px;
        }

        th {
            text-align: left;

            background: var(--cream);

            color: var(--muted);

            font-size: 11px;

            padding: 15px;

            border-bottom: 1px solid var(--line);
        }

        td {
            padding: 17px 15px;

            font-size: 12px;

            border-bottom: 1px solid #f3e8eb;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .service {
            font-weight: bold;
        }

        .status {
            display: inline-block;

            background: #e4f3ea;

            color: var(--green);

            padding: 5px 10px;

            border-radius: 15px;

            font-size: 10px;

            font-weight: bold;
        }

        .delete-button {
            border: none;

            background: #f8e5e8;

            color: #a64d66;

            padding: 7px 11px;

            border-radius: 15px;

            font-size: 10px;

            cursor: pointer;
        }

        .delete-button:hover {
            background: #f0ccd4;
        }


        /* SIN CITAS */

        .empty {
            text-align: center;

            padding: 60px 20px;

            color: var(--muted);
        }

        .empty-icon {
            font-size: 45px;

            margin-bottom: 15px;
        }

        .empty h3 {
            font-family: Georgia, serif;

            font-size: 24px;

            color: var(--text);

            margin-bottom: 8px;
        }


        /* BOTÓN VOLVER */

        .back-button {
            display: inline-block;

            margin-top: 25px;

            color: var(--pink-dark);

            font-size: 12px;

            text-decoration: none;
        }

        .back-button:hover {
            text-decoration: underline;
        }


        /* RESPONSIVE */

        @media (max-width: 700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                width: 92%;
            }

            .page-title h1 {
                font-size: 32px;
            }

            .appointments-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="brand">

            <span class="star">
                ✦
            </span>

            Belle Nails

        </div>


        <div style="display: flex; align-items: center; gap: 10px;">

    <div class="admin-label">
        👑 Administradora
    </div>

    <button
        onclick="cerrarSesion()"
        style="
            border: 1px solid #ead8dd;
            background: white;
            color: #b76884;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        "
    >
        Cerrar sesión
    </button>

</div>

    </header>



    <!-- CONTENIDO -->

    <main class="container">


        <!-- TÍTULO -->

        <div class="page-title">

            <span>
                PANEL DE ADMINISTRACIÓN
            </span>

            <h1>
                Mis citas
            </h1>

            <p>
                Aquí puedes consultar las citas que han reservado tus clientas.
            </p>

        </div>



        <!-- ESTADÍSTICAS -->

        <section class="stats">


            <div class="stat-card">

                <span>
                    Total de citas
                </span>

                <strong id="totalAppointments">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Citas de hoy
                </span>

                <strong id="todayAppointments">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Próximas citas
                </span>

                <strong id="upcomingAppointments">
                    0
                </strong>

            </div>


        </section>



        <!-- LISTA DE CITAS -->

        <section class="appointments-box">


            <div class="appointments-header">

                <h2>
                    Citas registradas
                </h2>

                <button
                    class="clear-button"
                    onclick="eliminarTodas()"
                >
                    Eliminar todas
                </button>

            </div>



            <div
                id="appointmentsContent"
                class="table-container"
            >

            </div>


        </section>



        <a
            href="index.html"
            class="back-button"
        >
            ← Volver a Belle Nails
        </a>


    </main>



    <script>

    // ==========================================
    // COMPROBAR SESIÓN DE ADMINISTRADORA
    // ==========================================

    const sesionAdmin =
        sessionStorage.getItem("belleNailsAdmin");


    if (sesionAdmin !== "true") {

        window.location.href = "login.html";

    }


    // AQUÍ CONTINÚA EL RESTO DEL CÓDIGO

        /*
        ==========================================
        OBTENER LAS CITAS
        ==========================================
        */

        function obtenerCitas() {

            const citas =
                localStorage.getItem("belleNailsCitas");

            if (!citas) {

                return [];

            }

            return JSON.parse(citas);

        }



        /*
        ==========================================
        MOSTRAR LAS CITAS
        ==========================================
        */

        function mostrarCitas() {

            const citas = obtenerCitas();

            const container =
                document.getElementById(
                    "appointmentsContent"
                );


            /*
            ACTUALIZAR ESTADÍSTICAS
            */

            document.getElementById(
                "totalAppointments"
            ).textContent = citas.length;


            const hoy =
                new Date().toISOString().split("T")[0];


            const citasHoy =
                citas.filter(
                    cita => cita.date === hoy
                );


            document.getElementById(
                "todayAppointments"
            ).textContent = citasHoy.length;


            const futuras =
                citas.filter(
                    cita => cita.date >= hoy
                );


            document.getElementById(
                "upcomingAppointments"
            ).textContent = futuras.length;



            /*
            SI NO HAY CITAS
            */

            if (citas.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            💅
                        </div>

                        <h3>
                            No hay citas todavía
                        </h3>

                        <p>
                            Cuando una clienta reserve,
                            aparecerá aquí.
                        </p>

                    </div>

                `;

                return;

            }



            /*
            CREAR TABLA
            */

            let html = `

                <table>

                    <thead>

                        <tr>

                            <th>
                                CLIENTA
                            </th>

                            <th>
                                TELÉFONO
                            </th>

                            <th>
                                SERVICIO
                            </th>

                            <th>
                                FECHA
                            </th>

                            <th>
                                HORA
                            </th>

                            <th>
                                ESTADO
                            </th>

                            <th>
                                ACCIÓN
                            </th>

                        </tr>

                    </thead>

                    <tbody>

            `;



            citas.forEach(
                (cita, index) => {

                    const fecha =
                        convertirFecha(cita.date);


                    html += `

                        <tr>

                            <td>
                                <strong>
                                    ${escapeHTML(cita.name)}
                                </strong>
                            </td>

                            <td>
                                ${escapeHTML(cita.phone)}
                            </td>

                            <td class="service">
                                ${escapeHTML(cita.service)}
                            </td>

                            <td>
                                ${fecha}
                            </td>

                            <td>
                                ${escapeHTML(cita.time)}
                            </td>

                            <td>

                                <span class="status">
                                    Confirmada
                                </span>

                            </td>

                            <td>

                                <button
                                    class="delete-button"
                                    onclick="eliminarCita(${index})"
                                >
                                    Eliminar
                                </button>

                            </td>

                        </tr>

                    `;

                }
            );


            html += `

                    </tbody>

                </table>

            `;


            container.innerHTML = html;

        }



        /*
        ==========================================
        CONVERTIR FECHA
        ==========================================
        */

        function convertirFecha(fecha) {

            if (!fecha) {

                return "-";

            }

            const partes =
                fecha.split("-");


            return (
                partes[2] +
                "/" +
                partes[1] +
                "/" +
                partes[0]
            );

        }



        /*
        ==========================================
        ELIMINAR UNA CITA
        ==========================================
        */

        function eliminarCita(index) {

            const confirmar =
                confirm(
                    "¿Seguro que quieres eliminar esta cita?"
                );


            if (!confirmar) {

                return;

            }


            const citas =
                obtenerCitas();


            citas.splice(index, 1);


            localStorage.setItem(
                "belleNailsCitas",
                JSON.stringify(citas)
            );


            mostrarCitas();

        }



        /*
        ==========================================
        ELIMINAR TODAS
        ==========================================
        */

        function eliminarTodas() {

            const citas =
                obtenerCitas();


            if (citas.length === 0) {

                alert(
                    "No hay citas para eliminar."
                );

                return;

            }


            const confirmar =
                confirm(
                    "¿Seguro que quieres eliminar TODAS las citas?"
                );


            if (!confirmar) {

                return;

            }


            localStorage.removeItem(
                "belleNailsCitas"
            );


            mostrarCitas();

        }



        /*
        ==========================================
        PROTEGER TEXTO
        ==========================================
        */

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text || "";

            return div.innerHTML;

        }



        /*
        ==========================================
        CARGAR AL ABRIR
        ==========================================
        */

        mostrarCitas();

 function cerrarSesion() {

    sessionStorage.removeItem("belleNailsAdmin");

    window.location.href = "login.html";

}

    </script>


</body>

</html>
