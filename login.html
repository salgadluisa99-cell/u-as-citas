<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio de sesión | LuStyle</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;font:300 1rem/1.6 Jost,system-ui,sans-serif;color:#2b1220;background:radial-gradient(circle at 15% 20%,#8e2d57 0,transparent 45%),radial-gradient(circle at 90% 80%,#c9774f 0,transparent 40%),#2b1220}
.box{width:100%;max-width:420px;background:#fff7f2;border-radius:30px;padding:38px 32px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.logo{font:700 2.4rem "Cormorant Garamond",serif;text-align:center}.logo i{color:#c9a063;font-weight:500}
.eb{text-align:center;letter-spacing:.3em;font-size:.68rem;color:#c9a063;margin:4px 0 22px}
label{font-size:.8rem;font-weight:500;display:block;margin:12px 0 6px}
input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #f1d6d6;background:#fff;font:300 1rem Jost,sans-serif;color:#2b1220}
input:focus{outline:2px solid #d4607f;border-color:transparent}
button{width:100%;margin-top:22px;border:0;cursor:pointer;padding:15px;border-radius:30px;color:#fff;font:500 .95rem Jost;letter-spacing:.06em;background:linear-gradient(135deg,#d4607f,#c9a063)}
.err{display:none;margin-top:14px;text-align:center;color:#c4414f;font-size:.88rem}
a{display:block;text-align:center;margin-top:18px;color:#d4607f;text-decoration:none;font-size:.9rem}
</style>
</head>
<body>
<div class="box">
<div class="logo">Lu<i>Style</i></div><p class="eb">ÁREA PRIVADA</p>
<form id="f">
<label for="u" id="lu">Usuario</label><input id="u" autocomplete="username" required>
<label for="p">Contraseña</label><input id="p" type="password" autocomplete="current-password" required>
<button type="submit">Iniciar sesión</button>
<p class="err" id="e">Usuario o contraseña incorrectos.</p>
</form>
<a href="index.html">← Volver a LuStyle</a>
</div>
<script src="config.js"></script>
<script>
/* LuStyle · capa de datos (citas). La configuración viene de config.js (opcional). */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || null;
const ADMIN_LOCAL = { usuario: "admin", clave: "LuStyle2026" }; // solo para el modo prueba
const LS_KEY = "belleNailsCitas";
const FB_V = "10.12.2";
const SLOTS = window.HORARIOS || ["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00"];
const ANTICIPACION_MIN = window.ANTICIPACION_MIN ?? 60; // minutos mínimos de anticipación para agendar

let _fb;
function _loadFb() {
  return _fb || (_fb = (async () => {
    const b = `https://www.gstatic.com/firebasejs/${FB_V}/`;
    const [A, F, Au] = await Promise.all([import(b + "firebase-app.js"), import(b + "firebase-firestore.js"), import(b + "firebase-auth.js")]);
    const app = A.initializeApp(FIREBASE_CONFIG);
    return { F, Au, db: F.getFirestore(app), auth: Au.getAuth(app) };
  })());
}
const _ls = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { return []; } };
const _save = l => localStorage.setItem(LS_KEY, JSON.stringify(l));
const _slotId = c => c.date + "_" + c.time;
/* Un "permission-denied" solo es hora ocupada si ese horario realmente existe; si no, es un problema de reglas */
async function _denegado(F, db, c, e) {
  if (e && e.code === "permission-denied") {
    try { if ((await F.getDoc(F.doc(db, "ocupados", _slotId(c)))).exists()) return new Error("OCUPADO"); } catch (_) {}
    return new Error("Firebase rechazó el guardado (revisa las reglas de Firestore)");
  }
  return e;
}

const Datos = {
  nube: !!FIREBASE_CONFIG,

  /* Horas ya tomadas de un día (sin datos personales) */
  async ocupados(date) {
    if (this.nube) {
      const { F, db } = await _loadFb();
      const r = await F.getDocs(F.query(F.collection(db, "ocupados"), F.where("date", "==", date)));
      return r.docs.map(d => d.data().time);
    }
    return _ls().filter(c => c.date === date && c.estado !== "cancelada").map(c => c.time);
  },

  /* Crea la cita y reserva la hora; lanza Error("OCUPADO") si otra clienta ya la tomó */
  async crear(c) {
    c.estado = "pendiente"; c.creada = Date.now();
    if (this.nube) {
      const { F, db } = await _loadFb();
      const ref = F.doc(F.collection(db, "citas")), b = F.writeBatch(db);
      b.set(ref, c);
      b.set(F.doc(db, "ocupados", _slotId(c)), { date: c.date, time: c.time, cita: ref.id });
      try { await b.commit(); } catch (e) { throw await _denegado(F, db, c, e); }
      return ref.id;
    }
    const l = _ls();
    if (l.some(x => x.date === c.date && x.time === c.time && x.estado !== "cancelada")) throw new Error("OCUPADO");
    c.id = "c" + c.creada + Math.random().toString(36).slice(2, 6);
    l.push(c); _save(l); return c.id;
  },

  async listar() {
    if (this.nube) {
      const { F, db } = await _loadFb();
      const r = await F.getDocs(F.query(F.collection(db, "citas"), F.orderBy("creada", "desc")));
      return r.docs.map(d => ({ ...d.data(), id: d.id }));
    }
    const l = _ls(); let ch = false;
    l.forEach((c, i) => {
      if (!c.id) { c.id = "c" + i + Math.random().toString(36).slice(2, 6); ch = true; }
      if (!c.estado) { c.estado = "pendiente"; ch = true; }
    });
    if (ch) _save(l);
    return l.slice().reverse();
  },

  async actualizar(id, cambios) {
    if (this.nube) { const { F, db } = await _loadFb(); return F.updateDoc(F.doc(db, "citas", id), cambios); }
    const l = _ls(), c = l.find(x => x.id === id); if (c) Object.assign(c, cambios); _save(l);
  },

  /* Vuelve a reservar la hora de una cita cancelada (si ya la tomó otra, lanza Error("OCUPADO")) */
  async ocupar(c) {
    if (this.nube) {
      const { F, db } = await _loadFb();
      try { await F.setDoc(F.doc(db, "ocupados", _slotId(c)), { date: c.date, time: c.time, cita: c.id }); }
      catch (e) { throw await _denegado(F, db, c, e); }
      return;
    }
    if (_ls().some(x => x.id !== c.id && x.date === c.date && x.time === c.time && x.estado !== "cancelada")) throw new Error("OCUPADO");
  },

  /* Libera la hora de una cita (al cancelarla o eliminarla) sin tocar la de otra clienta */
  async liberar(c) {
    if (!this.nube) return;
    const { F, db } = await _loadFb(), ref = F.doc(db, "ocupados", _slotId(c)), s = await F.getDoc(ref);
    if (s.exists() && s.data().cita === c.id) await F.deleteDoc(ref);
  },

  async eliminar(c) {
    await this.liberar(c);
    if (this.nube) { const { F, db } = await _loadFb(); return F.deleteDoc(F.doc(db, "citas", c.id)); }
    _save(_ls().filter(x => x.id !== c.id));
  },

  async eliminarTodas() {
    if (this.nube) { for (const c of await this.listar()) await this.eliminar(c); return; }
    localStorage.removeItem(LS_KEY);
  },

  async login(usuario, clave) {
    if (this.nube) { const { Au, auth } = await _loadFb(); await Au.signInWithEmailAndPassword(auth, usuario, clave); return true; }
    if (usuario === ADMIN_LOCAL.usuario && clave === ADMIN_LOCAL.clave) { sessionStorage.setItem("belleNailsAdmin", "true"); return true; }
    throw new Error("credenciales");
  },

  async haySesion() {
    if (this.nube) { const { Au, auth } = await _loadFb(); return new Promise(r => { const u = Au.onAuthStateChanged(auth, x => { u(); r(!!x); }); }); }
    return sessionStorage.getItem("belleNailsAdmin") === "true";
  },

  async salir() {
    if (this.nube) { const { Au, auth } = await _loadFb(); await Au.signOut(auth); }
    sessionStorage.removeItem("belleNailsAdmin");
  }
};

/* "14:00" -> "2:00 PM" (los textos viejos como "3:00 PM" se dejan igual) */
function fmtH(t) {
  const m = /^(\d{2}):(\d{2})$/.exec(t || ""); if (!m) return t || "";
  let h = +m[1]; const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + m[2] + " " + ap;
}

/* Teléfono de la clienta al formato de WhatsApp (Colombia +57) */
function telWhatsApp(t) {
  let d = String(t || "").replace(/\D/g, "");
  if (d.length === 10) d = "57" + d;
  return d;
}

</script>
<script>
if(Datos.nube){lu.textContent="Correo";u.type="email"}
f.onsubmit=async ev=>{ev.preventDefault();e.style.display="none";
try{await Datos.login(u.value.trim(),p.value);location.href="admin.html"}
catch(x){e.style.display="block";p.value=""}};
</script>
</body>
</html>
