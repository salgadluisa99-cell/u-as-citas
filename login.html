<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inicio de sesión | Belle Nails</title>


    <style>

        :root {
            --cream: #fcf8f5;
            --pink: #c67b96;
            --pink-dark: #b76884;
            --pink-light: #f2dfe5;
            --text: #2f1a1f;
            --muted: #876d76;
            --line: #ead8dd;
            --white: #ffffff;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: var(--cream);

            font-family: Arial, sans-serif;

            color: var(--text);

        }


        /* =========================
           CONTENEDOR
        ========================== */

        .login-container {

            width: 90%;

            max-width: 430px;

            background: white;

            border: 1px solid var(--line);

            border-radius: 25px;

            padding: 45px;

            box-shadow:
                0 20px 45px
                rgba(80, 40, 50, 0.10);

        }


        /* =========================
           LOGO
        ========================== */

        .logo {

            text-align: center;

            margin-bottom: 30px;

        }


        .logo-icon {

            color: var(--pink);

            font-size: 35px;

            display: block;

            margin-bottom: 5px;

        }


        .logo h1 {

            font-family: Georgia, serif;

            font-size: 30px;

        }


        .logo p {

            color: var(--muted);

            font-size: 12px;

            margin-top: 7px;

        }


        /* =========================
           TÍTULO
        ========================== */

        .login-title {

            text-align: center;

            margin-bottom: 28px;

        }


        .login-title span {

            color: var(--pink);

            font-size: 10px;

            letter-spacing: 3px;

        }


        .login-title h2 {

            font-family: Georgia, serif;

            font-size: 25px;

            margin-top: 8px;

        }


        /* =========================
           FORMULARIO
        ========================== */

        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 8px;

            color: #5e4850;

        }


        .form-group input {

            width: 100%;

            padding: 14px;

            border: 1px solid var(--line);

            border-radius: 12px;

            outline: none;

            font-size: 13px;

        }


        .form-group input:focus {

            border-color: var(--pink);

            box-shadow:
                0 0 0 3px
                var(--pink-light);

        }


        /* =========================
           BOTÓN
        ========================== */

        .login-button {

            width: 100%;

            border: none;

            background: var(--pink);

            color: white;

            padding: 14px;

            border-radius: 25px;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

        }


        .login-button:hover {

            background: var(--pink-dark);

        }


        /* =========================
           ERROR
        ========================== */

        .error-message {

            display: none;

            background: #f9e5e8;

            color: #a64d66;

            border-radius: 10px;

            padding: 11px;

            font-size: 11px;

            text-align: center;

            margin-top: 15px;

        }


        /* =========================
           VOLVER
        ========================== */

        .back-link {

            display: block;

            text-align: center;

            margin-top: 25px;

            color: var(--pink-dark);

            font-size: 12px;

            text-decoration: none;

        }


        .back-link:hover {

            text-decoration: underline;

        }


        /* =========================
           INFORMACIÓN
        ========================== */

        .security-info {

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid var(--line);

            text-align: center;

            color: var(--muted);

            font-size: 10px;

            line-height: 1.6;

        }


        @media (max-width: 500px) {

            .login-container {

                padding: 30px 25px;

            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- LOGO -->

        <div class="logo">

            <span class="logo-icon">
                ✦
            </span>

            <h1>
                Belle Nails
            </h1>

            <p>
                Nail Studio
            </p>

        </div>


        <!-- TÍTULO -->

        <div class="login-title">

            <span>
                ÁREA PRIVADA
            </span>

            <h2>
                Inicio de sesión
            </h2>

        </div>


        <!-- FORMULARIO -->

        <form id="loginForm">


            <!-- USUARIO -->

            <div class="form-group">

                <label for="username">
                    Usuario
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Ingresa tu usuario"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- CONTRASEÑA -->

            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingresa tu contraseña"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- BOTÓN -->

            <button
                type="submit"
                class="login-button"
            >
                Iniciar sesión
            </button>


            <!-- ERROR -->

            <div
                id="errorMessage"
                class="error-message"
            >
                Usuario o contraseña incorrectos.
            </div>


        </form>


        <!-- VOLVER -->

        <a
            href="index.html"
            class="back-link"
        >
            ← Volver a Belle Nails
        </a>


        <!-- INFORMACIÓN -->

        <div class="security-info">

            Área exclusiva para la administradora
            de Belle Nails.

        </div>


    </div>



    <script>

        /*
        ==========================================
        DATOS DE ADMINISTRADORA
        ==========================================
        */

        const USUARIO_ADMIN = "admin";

        const CONTRASENA_ADMIN = "BelleNails2026";


        /*
        ==========================================
        FORMULARIO DE LOGIN
        ==========================================
        */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const username =
                        document
                            .getElementById("username")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const errorMessage =
                        document
                            .getElementById("errorMessage");


                    /*
                    ==================================
                    COMPROBAR CREDENCIALES
                    ==================================
                    */

                    if (
                        username === USUARIO_ADMIN &&
                        password === CONTRASENA_ADMIN
                    ) {


                        /*
                        Guardar sesión
                        */

                        sessionStorage.setItem(
                            "belleNailsAdmin",
                            "true"
                        );


                        /*
                        Ir al panel
                        */

                        window.location.href =
                            "admin.html";


                    } else {


                        /*
                        Mostrar error
                        */

                        errorMessage.style.display =
                            "block";


                        /*
                        Limpiar contraseña
                        */

                        document
                            .getElementById("password")
                            .value = "";

                    }

                }
            );

    </script>


</body>

</html>
